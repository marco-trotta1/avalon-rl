name: Avalon validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: avalon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install the Node dependencies
        run: npm ci --ignore-scripts
      - name: Check the types
        run: npm run typecheck
      - name: Check the agent package
        run: npm run check:agent
      - name: Test the Node workflows
        run: npm test
      - name: Check the privacy boundary
        run: npm run check:privacy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: python/requirements-tested.txt
      - name: Install the tested Python dependencies
        run: python -m pip install -r python/requirements-tested.txt
      - name: Install the local Python package
        run: python -m pip install --no-deps ./python
      - name: Test the real pipeline and the Node comparison
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src
          AVALON_CLI: ${{ github.workspace }}/dist/cli.js
        run: python -m pytest python/tests -q
      - name: Build the local package
        run: npm pack --dry-run
