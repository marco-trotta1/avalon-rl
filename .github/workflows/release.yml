name: Avalon release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: python/requirements-tested.txt
      - name: Install the tested dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install -r python/requirements-tested.txt
          python -m pip install --no-deps ./python
      - name: Verify the source
        run: |
          npm test
          npm run typecheck
          npm run check:privacy
          npm run check:agent
          AVALON_CLI="$PWD/dist/cli.js" PYTHONPATH="$PWD/python/src" python -m pytest python/tests -q
      - name: Build the packages and the manifest
        run: |
          mkdir release
          npm pack --pack-destination release
          python -m pip wheel --no-deps --wheel-dir release ./python
          node scripts/release-manifest.mjs --directory release --commit "$GITHUB_SHA"
      - name: Install and check the packages
        run: |
          mkdir /tmp/avalon-release-smoke
          npm install --ignore-scripts --prefix /tmp/avalon-release-smoke "$PWD"/release/*.tgz
          /tmp/avalon-release-smoke/node_modules/.bin/avalon lab-demo --fault none
          /tmp/avalon-release-smoke/node_modules/.bin/avalon world-run --data /tmp/avalon-release-smoke/node_modules/avalon-rl/examples/world/claim-plan.json
          mkdir /tmp/avalon-release-smoke/project
          for host in cursor claude codex; do
            /tmp/avalon-release-smoke/node_modules/.bin/avalon agent install --host "$host" --project /tmp/avalon-release-smoke/project
          done
          /tmp/avalon-release-smoke/node_modules/.bin/avalon agent commands --json
          /tmp/avalon-release-smoke/node_modules/.bin/avalon agent doctor --project /tmp/avalon-release-smoke/project
          python -m pip install --no-deps --force-reinstall release/*.whl
          cd /tmp
          avalon-python --help
          avalon-python gym-train --episodes 2 --max-steps 20 --output /tmp/avalon-release-smoke/training
          avalon-python gym-eval --checkpoint /tmp/avalon-release-smoke/training/checkpoint.json --seeds 1001,1002 --max-steps 20 --output /tmp/avalon-release-smoke/evaluation.json
          avalon-python gym-probs --checkpoint /tmp/avalon-release-smoke/training/checkpoint.json --episodes 1 --max-steps 20 --output /tmp/avalon-release-smoke/probabilities
          avalon-python sampling-audit --source /tmp/avalon-release-smoke/probabilities/source.json --target /tmp/avalon-release-smoke/probabilities/target.json --output /tmp/avalon-release-smoke/sampling.json
          avalon-python credit-audit --source /tmp/avalon-release-smoke/training/credit.json --output /tmp/avalon-release-smoke/credit-audit.json
      - name: Preserve the verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: avalon-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
