name: Reproducible failure
description: Report a local failure with a synthetic reproducer.
body:
  - type: markdown
    attributes:
      value: Do not upload private snapshots, witnesses, source documents, or customer data. Use a synthetic reproducer.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the Avalon commit and the Node or Python version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command, expected result, actual result, and a synthetic fixture.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence limits
      description: State what the example proves and what remains unknown.
