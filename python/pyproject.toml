[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "avalon-rl-lab"
version = "0.1.0"
description = "Local Gymnasium and Minari preservation experiments for Avalon."
requires-python = ">=3.13"
dependencies = ["gymnasium==1.2.3", "numpy==2.4.2"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
avalon-python = "avalon_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
