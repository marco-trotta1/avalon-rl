<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title description">
  <title id="title">Avalon: a laboratory for curious agents</title>
  <desc id="description">A pixel agent explores a synthetic world. A reward bug meets an independent check. Avalon keeps the resulting evidence.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#394052" opacity="0.55"/>
    </pattern>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b9a5fa" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#b9a5fa" stop-opacity="0.02"/>
    </linearGradient>
    <style>
      text { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .label { fill: #c2c3d1; font-size: 12px; letter-spacing: 1.2px; }
      .note { fill: #a6a9bc; font-size: 13px; }
      .float { animation: float 4s ease-in-out infinite; }
      .bug { animation: wiggle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .orbit { animation: orbit 24s linear infinite; transform-origin: 520px 363px; }
      .flow { stroke-dasharray: 5 8; animation: flow 3s linear infinite; }
      .packet { animation: packet 4s ease-in-out infinite; }
      .packet.later { animation-delay: -2s; }
      .spark { animation: spark 4s ease-in-out infinite; }
      .spark.later { animation-delay: -1.7s; }
      .eyes { animation: blink 6s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes wiggle { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-6px) rotate(7deg); } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes flow { to { stroke-dashoffset: -52; } }
      @keyframes packet { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { transform: translateX(114px); opacity: 0; } }
      @keyframes spark { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      @keyframes blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(0.1); } }
      @media (prefers-reduced-motion: reduce) {
        .float, .bug, .orbit, .flow, .packet, .spark, .eyes { animation: none; }
        .packet { opacity: 0; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1038" height="568" rx="18" fill="#12151f" stroke="#34394b"/>
  <rect x="2" y="2" width="1036" height="566" rx="17" fill="url(#grid)"/>
  <path d="M28 48h8m-4-4v8M1004 48h8m-4-4v8M28 524h8m-4-4v8M1004 524h8m-4-4v8" stroke="#64657d"/>

  <text x="52" y="49" class="label" fill="#b9a5fa">A SMALL LAB FOR BIG REWARD QUESTIONS</text>
  <circle cx="845" cy="44" r="4" fill="#f2c879" class="spark"/>
  <text x="860" y="49" class="label">MIT / OPEN LAB</text>
  <text x="47" y="153" fill="#eeebfa" font-size="108" font-style="italic" style="font-family: Georgia, 'Times New Roman', serif; letter-spacing: -5px;">Avalon</text>
  <text x="390" y="150" fill="#b9a5fa" font-size="23">/ RL</text>
  <text x="52" y="192" fill="#c9c7d8" font-size="17">Build a world. Question the reward. Keep the evidence.</text>

  <g transform="translate(791 100)">
    <path d="M0 4L169 0l5 83L5 88Z" fill="#20212e" stroke="#49445e"/>
    <path d="M12 17l144-4M15 66l142-5" stroke="#393549"/>
    <text x="87" y="44" fill="#f2c879" font-size="20" text-anchor="middle" transform="rotate(-2 87 44)">r != success</text>
    <text x="23" y="75" fill="#aaa3be" font-size="10" transform="rotate(-2 23 75)">always check the world</text>
    <path d="M146-9l-6 24 9 2 6-24" fill="none" stroke="#80738e" stroke-width="3"/>
  </g>
  <g class="spark" fill="#cbb7ff">
    <path d="M725 119v12m-6-6h12"/>
    <circle cx="680" cy="72" r="2"/>
    <circle cx="749" cy="180" r="1.5"/>
  </g>

  <rect x="44" y="229" width="952" height="251" rx="12" fill="#171b27" stroke="#36394e"/>
  <path d="M44 277h952" stroke="#36394e"/>
  <text x="67" y="258" class="label">01 / BUILD A WORLD</text>
  <text x="384" y="258" class="label">02 / CHALLENGE A REWARD</text>
  <text x="735" y="258" class="label">03 / KEEP THE EVIDENCE</text>
  <circle cx="969" cy="253" r="4" fill="#b9a5fa" class="spark later"/>

  <path d="M284 363H424" stroke="#736388" stroke-width="2" class="flow"/>
  <path d="M414 357l10 6-10 6" fill="none" stroke="#b9a5fa" stroke-width="2"/>
  <g transform="translate(292 363)"><circle r="3" fill="#cdb7ff" class="packet"/></g>
  <text x="313" y="344" fill="#8c839f" font-size="11">act()</text>
  <path d="M625 363H766" stroke="#527880" stroke-width="2" class="flow"/>
  <path d="M756 357l10 6-10 6" fill="none" stroke="#9cd8d6" stroke-width="2"/>
  <g transform="translate(634 363)"><circle r="3" fill="#9cd8d6" class="packet later"/></g>
  <text x="656" y="344" fill="#889da9" font-size="11">check()</text>

  <ellipse cx="198" cy="424" rx="67" ry="8" fill="#0e111b"/>
  <path d="M112 416l83-34 84 34-83 28Z" fill="#252735" stroke="#4b455d"/>
  <path d="M112 416v10l84 29 83-29v-10M196 444v11" fill="none" stroke="#4b455d"/>
  <g class="float">
    <g shape-rendering="crispEdges">
      <path d="M162 342h12v-20h12v-20h12v-19h12v39h12v20h12v10h-72Z" fill="#a58be4"/>
      <path d="M162 342h72v10h-72Z" fill="#d2c0ff"/>
      <path d="M210 315h6v6h-6zM184 333h6v6h-6z" fill="#f2c879"/>
      <path d="M174 352h48v37h-48Z" fill="#e5deee"/>
      <path d="M174 381h48v25h-48Z" fill="#8b7ab4"/>
      <path d="M174 406h18v8h-18ZM210 406h18v8h-18Z" fill="#d2c0ff"/>
      <path d="M162 372h12v16h-12ZM222 367h12v16h-12Z" fill="#b9a5fa"/>
      <g class="eyes" fill="#262032"><path d="M184 363h6v8h-6ZM205 363h6v8h-6Z"/></g>
      <path d="M194 378h10v3h-10Z" fill="#8e6b99"/>
      <path d="M237 348h4v53h-4Z" fill="#c7aa85"/>
      <path d="M234 340h10v10h-10Z" fill="#f2c879"/>
    </g>
    <path d="M81 310h83v30h-35l-9 9v-9H81Z" fill="#252433" stroke="#635476"/>
    <text x="92" y="330" fill="#d2c0ff" font-size="11">let's try</text>
  </g>
  <text x="113" y="464" class="note">a curious little agent</text>

  <circle cx="520" cy="363" r="72" fill="url(#glass)" stroke="#494057"/>
  <ellipse cx="520" cy="363" rx="87" ry="39" transform="rotate(-28 520 363)" fill="none" stroke="#736084" stroke-dasharray="3 7"/>
  <g class="orbit">
    <circle cx="520" cy="363" r="89" fill="none" stroke="#393347" stroke-dasharray="1 11"/>
    <circle cx="520" cy="274" r="4" fill="#b9a5fa"/>
  </g>
  <g class="float" style="animation-delay: -1s">
    <path d="M520 315l12 26 29 4-21 20 5 29-25-14-25 14 5-29-21-20 29-4Z" fill="#f2c879" stroke="#ffe2a6" stroke-width="2" stroke-linejoin="round"/>
    <path d="M512 349v10m16-10v10" stroke="#6d4c3c" stroke-width="4" stroke-linecap="round"/>
    <path d="M515 366q5 5 10 0" fill="none" stroke="#6d4c3c" stroke-width="2" stroke-linecap="round"/>
  </g>
  <rect x="482" y="414" width="76" height="24" rx="12" fill="#332b28" stroke="#66503b"/>
  <text x="499" y="430" fill="#f2c879" font-size="12">r = +1</text>
  <g class="bug">
    <path d="M585 309l-7-8m24 8 7-8M577 326h-8m42 0h8m-40 10-7 7m37-7 7 7" fill="none" stroke="#e9a29f" stroke-width="3" stroke-linecap="round"/>
    <path d="M579 320q0-15 15-15t15 15v11q0 15-15 15t-15-15Z" fill="#e9a29f"/>
    <path d="M594 323v21" stroke="#a8677b" stroke-width="2"/>
    <path d="M587 316v4m14-4v4" stroke="#382a3d" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="444" y="464" class="note">the loophole says hello</text>

  <g transform="translate(796 302)">
    <path d="M0 0h84l20 20v105H0Z" fill="#242a37" stroke="#83889e" stroke-width="2"/>
    <path d="M84 0v20h20" fill="#343b4b" stroke="#83889e" stroke-width="2"/>
    <text x="13" y="35" fill="#d9d8e8" font-size="12">EVIDENCE</text>
    <path d="M14 51h67M14 64h52M14 77h61M14 90h35" stroke="#626b84" stroke-width="3"/>
    <path d="M14 108h29" stroke="#b9a5fa" stroke-width="3"/>
  </g>
  <g class="float" style="animation-delay: -2s">
    <path d="M899 402l26 27" stroke="#9cd8d6" stroke-width="10" stroke-linecap="round"/>
    <circle cx="879" cy="381" r="31" fill="#172c32" fill-opacity="0.92" stroke="#9cd8d6" stroke-width="5"/>
    <path d="M869 371l20 20m0-20-20 20" stroke="#e9a29f" stroke-width="4" stroke-linecap="round"/>
    <path d="M860 375a22 22 0 0 1 14-15" fill="none" stroke="#d5f2ed" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="791" y="464" class="note">a witness you can replay</text>

  <path d="M44 513h952" stroke="#34394b"/>
  <text x="52" y="544" fill="#b9a5fa" font-size="13">$ avalon world-demo</text>
  <text x="642" y="544" fill="#a6a9bc" font-size="11" letter-spacing="0.6">SYNTHETIC WORLD / NO MODEL CALLS</text>
  <path d="M970 539l5 5-5 5m9-10 5 5-5 5" fill="none" stroke="#f2c879" stroke-width="1.5" class="spark"/>
</svg>
